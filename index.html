<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiciRuta</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header>
      <img src="img/logo_biciruta.png" alt="Logotipo de BiciRuta" width="160" />
      <button id="btn-menu">Menú</button>
      <nav>
        <ul id="menu">
          <li>Tienda</li>
          <li>Taller</li>
          <li>Alquiler</li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Bicicletas y accesorios</h1>
      <div class="producto">
        <h2>Bici Urbana U100</h2>
        <p class="precio">389,00 €</p>
        <button>Añadir</button>
      </div>
      <div class="producto">
        <h2>Casco Urban M</h2>
        <p class="precio oferta">39,90 €</p>
        <button>Añadir</button>
      </div>
      <div class="producto">
        <h2>Candado U Pro</h2>
        <p class="precio">29,95 €</p>
        <button>Añadir</button>
      </div>
      <p>Productos en el carrito: <span id="contador">0</span></p>
      <section class="ofertas">
        <h2>Ofertas de la semana</h2>
        <p>20 % de descuento en cascos y candados hasta el domingo.</p>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
