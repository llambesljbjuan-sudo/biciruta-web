<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BiciRuta</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
  header { background: #152A1D; color: white; padding: 20px; }
  nav ul { list-style: none; display: none; padding: 0; }
  nav ul.abierto { display: block; }
  .producto { background: white; margin: 10px; padding: 15px; width: 220px; display: inline-block; }
  .precio { color: #2C7A3F; font-size: 22px; font-weight: bold; }
  .oferta { color: #bbbbbb; }
</style>
</head>
<body>
<header>
  <img src="img/logo-biciruta.png" width="160">
  <button id="btn-menu">Menú</button>
  <nav><ul id="menu"><li>Tienda</li><li>Taller</li><li>Alquiler</li></ul></nav>
</header>
<main>
  <h1>Bicicletas y accesorios</h1>
  <div class="producto"><h2>Bici Urbana U100</h2><p class="precio" style="color:#bbbbbb">389,00 €</p><button onclick="anadir('Bici Urbana U100')">Añadir</button></div>
  <div class="producto"><h2>Casco Urban M</h2><p class="precio oferta">39,90 €</p><button onclick="anadir('Casco Urban M')">Añadir</button></div>
  <div class="producto"><h2>Candado U Pro</h2><p class="precio">29,95 €</p><button onclick="anadir('Candado U Pro')">Añadir</button></div>
  <p>Productos en el carrito: <span id="contador">0</span></p>
</main>
<script>
  let carrito = [];
  function anadir(producto) {
    carrito.push(producto);
    document.getElementById('contador').textContent = carrito.lenght;
    console.log('Añadido:', producto);
  }
  document.getElementById('boton-menu').addEventListener('click', function () {
    document.getElementById('menu').classList.toggle('abierto');
  });
</script>
</body>
</html>
